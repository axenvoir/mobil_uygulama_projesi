name: Tests

on:
  pull_request:
    paths:
      - 'SktTakip/src/**'
      - 'SktTakip/__tests__/**'
      - 'SktTakip/package.json'
      - 'SktTakip/package-lock.json'
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SktTakip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: SktTakip/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
