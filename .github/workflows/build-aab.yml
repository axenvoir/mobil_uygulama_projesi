name: Android CI and signed artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_release_tag:
        description: Type the exact version tag selected for this release (for example v2.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: expira-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify tests, lint, and debug APK
        run: |
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                           "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                           "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            export SDKMANAGER
            python3 - <<'PY'
          import os
          import subprocess
          import sys

          process = subprocess.Popen([os.environ["SDKMANAGER"], "--licenses"], stdin=subprocess.PIPE)
          try:
              process.communicate(input=b"y\n" * 1000)
          except BrokenPipeError:
              process.wait()
          sys.exit(process.returncode)
          PY
          else
            echo "::warning::sdkmanager not found in the Android SDK; relying on runner-preaccepted licenses and Gradle SDK validation"
          fi
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connectedDebugAndroidTest on API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace --console=plain || { test_status=$?; mkdir -p app/build/reports/androidTests/connected/debug; adb logcat -d -v threadtime '*:E' > app/build/reports/androidTests/connected/debug/ci-logcat-errors.txt || true; exit "$test_status"; }

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: expira-connected-test-results
          path: |
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: expira-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: expira-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  release-artifacts:
    name: Signed release APK and AAB
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.confirm_release_tag == github.ref_name
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: play-production
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify confirmed release tag
        shell: bash
        env:
          CONFIRMED_RELEASE_TAG: ${{ inputs.confirm_release_tag }}
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release artifacts may only be created from a stable vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if [[ "$CONFIRMED_RELEASE_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The manually confirmed tag does not match the selected workflow ref"
            exit 1
          fi
          app_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" || "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::The release tag must match app/build.gradle.kts versionName"
            exit 1
          fi
          git fetch --no-tags origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::The release tag must point to the exact current main commit"
            exit 1
          fi

      - name: Verify Android SDK and accept licenses
        run: |
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                           "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                           "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            export SDKMANAGER
            python3 - <<'PY'
          import os
          import subprocess
          import sys

          process = subprocess.Popen([os.environ["SDKMANAGER"], "--licenses"], stdin=subprocess.PIPE)
          try:
              process.communicate(input=b"y\n" * 1000)
          except BrokenPipeError:
              process.wait()
          sys.exit(process.returncode)
          PY
            if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
              "$SDKMANAGER" --install "platforms;android-37.0"
            fi
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            echo "::error::Android SDK platform 37.0 is not installed on this runner"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_PRODUCTION_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PLAY_PRODUCTION_KEYSTORE_BASE64 is not configured in the play-production environment"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_PRODUCTION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_PRODUCTION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_PRODUCTION_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more release-signing secrets are not configured"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              return (value.replace("\\", "\\\\")
                           .replace("\n", "\\n")
                           .replace("\r", "\\r")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace("#", "\\#")
                           .replace("!", "\\!"))

          values = {
              "storeFile": "release.jks",
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(f"{key}={escape(value)}" + chr(10) for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      - name: Verify production AdMob IDs
        env:
          EXPIRA_ADMOB_APP_ID: ${{ secrets.PLAY_PRODUCTION_ADMOB_APP_ID }}
          EXPIRA_REWARDED_AD_UNIT_ID: ${{ secrets.PLAY_PRODUCTION_REWARDED_AD_UNIT_ID }}
        run: |
          if [ -z "$EXPIRA_ADMOB_APP_ID" ] || [ -z "$EXPIRA_REWARDED_AD_UNIT_ID" ]; then
            echo "::error::Add PLAY_PRODUCTION_ADMOB_APP_ID and PLAY_PRODUCTION_REWARDED_AD_UNIT_ID to play-production environment secrets before building a release artifact"
            exit 1
          fi
          if ! [[ "$EXPIRA_ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]] || \
             ! [[ "$EXPIRA_REWARDED_AD_UNIT_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
            echo "::error::The production AdMob application or rewarded ad unit ID has an invalid format"
            exit 1
          fi
          if [ "$EXPIRA_ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ] || \
             [ "$EXPIRA_REWARDED_AD_UNIT_ID" = "ca-app-pub-3940256099942544/5224354917" ]; then
            echo "::error::Google test AdMob IDs must never be used in a release artifact"
            exit 1
          fi

      - name: Build signed release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
        env:
          EXPIRA_ADMOB_APP_ID: ${{ secrets.PLAY_PRODUCTION_ADMOB_APP_ID }}
          EXPIRA_REWARDED_AD_UNIT_ID: ${{ secrets.PLAY_PRODUCTION_REWARDED_AD_UNIT_ID }}

      - name: Upload signed AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: expira-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: expira-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: expira-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90
