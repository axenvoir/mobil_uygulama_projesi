name: Build signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - vibe/skt-plus-android-015229

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<PROPERTIES
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPERTIES

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Collect native debug symbols
        run: |
          mkdir -p native-symbols
          find app/build/outputs -type d -name "native_debug_symbols" -exec cp -r {} native-symbols/ \; || true
          ls -R app/build/outputs || true

      - name: Upload native symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          path: app/build/outputs/bundle/release/*.json
          if-no-files-found: ignore
          retention-days: 14
