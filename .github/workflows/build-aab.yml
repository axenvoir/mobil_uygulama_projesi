name: Android CI and signed artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expira-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify tests, lint, and debug APK
        run: |
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                           "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                           "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            export SDKMANAGER
            python3 - <<'PY'
          import os
          import subprocess
          import sys

          process = subprocess.Popen([os.environ["SDKMANAGER"], "--licenses"], stdin=subprocess.PIPE)
          try:
              process.communicate(input=b"y\n" * 1000)
          except BrokenPipeError:
              process.wait()
          sys.exit(process.returncode)
          PY
          else
            echo "::warning::sdkmanager not found in the Android SDK; relying on runner-preaccepted licenses and Gradle SDK validation"
          fi
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connectedDebugAndroidTest on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          script: |
            set +e
            ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace --console=plain
            TEST_STATUS=$?
            if [ "$TEST_STATUS" -ne 0 ]; then
              mkdir -p app/build/reports/androidTests/connected/debug
              adb logcat -d -v threadtime '*:E' > app/build/reports/androidTests/connected/debug/ci-logcat-errors.txt || true
            fi
            exit "$TEST_STATUS"

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expira-connected-test-results
          path: |
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: expira-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expira-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  release-artifacts:
    name: Signed release APK and AAB
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK and accept licenses
        run: |
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                           "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                           "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            export SDKMANAGER
            python3 - <<'PY'
          import os
          import subprocess
          import sys

          process = subprocess.Popen([os.environ["SDKMANAGER"], "--licenses"], stdin=subprocess.PIPE)
          try:
              process.communicate(input=b"y\n" * 1000)
          except BrokenPipeError:
              process.wait()
          sys.exit(process.returncode)
          PY
            if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
              "$SDKMANAGER" "platforms;android-37"
            fi
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "::error::Android SDK platform 37 is not installed on this runner"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more release-signing secrets are not configured"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              return (value.replace("\\", "\\\\")
                           .replace("\n", "\\n")
                           .replace("\r", "\\r")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace("#", "\\#")
                           .replace("!", "\\!"))

          values = {
              "storeFile": "release.jks",
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(f"{key}={escape(value)}" + chr(10) for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      - name: Verify production AdMob IDs
        env:
          EXPIRA_ADMOB_APP_ID: ${{ secrets.EXPIRA_ADMOB_APP_ID }}
          EXPIRA_REWARDED_AD_UNIT_ID: ${{ secrets.EXPIRA_REWARDED_AD_UNIT_ID }}
        run: |
          if [ -z "$EXPIRA_ADMOB_APP_ID" ] || [ -z "$EXPIRA_REWARDED_AD_UNIT_ID" ]; then
            echo "::error::Add EXPIRA_ADMOB_APP_ID and EXPIRA_REWARDED_AD_UNIT_ID repository secrets before building a release artifact"
            exit 1
          fi
          if ! [[ "$EXPIRA_ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]] || \
             ! [[ "$EXPIRA_REWARDED_AD_UNIT_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
            echo "::error::The production AdMob application or rewarded ad unit ID has an invalid format"
            exit 1
          fi
          if [ "$EXPIRA_ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ] || \
             [ "$EXPIRA_REWARDED_AD_UNIT_ID" = "ca-app-pub-3940256099942544/5224354917" ]; then
            echo "::error::Google test AdMob IDs must never be used in a release artifact"
            exit 1
          fi

      - name: Build signed release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
        env:
          EXPIRA_ADMOB_APP_ID: ${{ secrets.EXPIRA_ADMOB_APP_ID }}
          EXPIRA_REWARDED_AD_UNIT_ID: ${{ secrets.EXPIRA_REWARDED_AD_UNIT_ID }}

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: expira-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: expira-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: expira-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90
