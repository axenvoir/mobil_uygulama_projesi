name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install
        working-directory: ./SktTakip

      - name: Increment versionCode
        run: |
          python3 - << 'EOF'
          import json, os

          path = 'app.json'
          with open(path) as f:
              data = json.load(f)

          android = data['expo']['android']
          current = android.get('versionCode', 1)
          next_code = current + 1
          android['versionCode'] = next_code

          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')

          print(f'versionCode: {current} -> {next_code}')
          EOF
        working-directory: ./SktTakip

      - name: Commit versionCode bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SktTakip/app.json
          git commit -m "chore: bump android versionCode to $(python3 -c "import json; print(json.load(open('SktTakip/app.json'))['expo']['android']['versionCode'])") [skip ci]" || echo "No versionCode changes to commit"
          git push
        working-directory: .

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install
        working-directory: ./SktTakip

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
        working-directory: ./SktTakip

      - name: Configure build.gradle
        run: |
          python3 - << 'EOF'
          import re

          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          # Eski hatalı eklemeleri temizle
          content = content.replace('signingConfig signingConfigs.release\n', '')
          content = content.replace('signingConfig signingConfigs.release', '')

          # 1. Anahtar tanımlama (signingConfigs) bloğunu doğru yere ekle
          release_signing = """
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }"""

          if 'signingConfigs {' in content:
              content = content.replace('signingConfigs {', 'signingConfigs {' + release_signing, 1)
          else:
              content = content.replace('android {', 'android {\n    signingConfigs {' + release_signing + '\n    }', 1)

          # 2. Derleme türleri (buildTypes) içindeki release bloğunu bul ve debug'ı release yap
          build_types_match = re.search(r'buildTypes\s*\{([\s\S]*?)\n    \}', content)
          if build_types_match:
              build_types = build_types_match.group(1)
              release_match = re.search(r'release\s*\{([\s\S]*?)\n        \}', build_types)
              if release_match:
                  release_block = release_match.group(0)
                  # İçindeki debug imzasını sil, release imzası ekle
                  new_release_block = release_block.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
                  content = content.replace(release_block, new_release_block)

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          EOF
        working-directory: ./SktTakip
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Signing Config
        run: |
          echo "--- signingConfigs block ---"
          grep -A 10 "signingConfigs {" android/app/build.gradle || true
          echo "--- buildTypes.release block ---"
          grep -A 15 "buildTypes {" android/app/build.gradle || true
        working-directory: ./SktTakip

      - name: Configure Gradle Memory
        run: |
          echo -e "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
        working-directory: ./SktTakip

      - name: Build AAB
        run: cd android && ./gradlew bundleRelease -x lintVitalRelease
        working-directory: ./SktTakip
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: SktTakip/android/app/build/outputs/bundle/release/app-release.aab
