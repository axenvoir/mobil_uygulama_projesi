name: Build Android AAB

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install
        working-directory: ./SktTakip

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install
        working-directory: ./SktTakip

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
        working-directory: ./SktTakip

      - name: Configure build.gradle
        run: |
          python3 - << 'EOF'
          import re

          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          release_config = """
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }"""

          # 1. signingConfigs bloğunu bul veya oluştur
          if 'signingConfigs {' in content:
              # signingConfigs bloğu varsa, release'i içine ekle (eğer yoksa)
              signing_block = content.split('signingConfigs {')[1].split('}')[0]
              if 'release {' not in signing_block:
                  content = content.replace('signingConfigs {', 'signingConfigs {' + release_config, 1)
          else:
              # signingConfigs bloğu yoksa, buildTypes'tan önce oluştur
              content = content.replace('buildTypes {', 'signingConfigs {' + release_config + '}\n    buildTypes {', 1)

          # 2. buildTypes.release içindeki signingConfig'i değiştir
          # Önce debug signingConfig'ini kaldır
          content = content.replace('signingConfig signingConfigs.debug', '')
          # Sonra release signingConfig'ini ekle (eğer yoksa)
          if 'signingConfig signingConfigs.release' not in content:
              # release bloğunu bul ve signingConfig ekle
              release_block_match = re.search(r'release\s*\{([^}]*)\}', content)
              if release_block_match:
                  release_block = release_block_match.group(1)
                  if 'signingConfig' not in release_block:
                      new_release_block = release_block + '\n            signingConfig signingConfigs.release'
                      content = content.replace(release_block, new_release_block)

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          EOF
        working-directory: ./SktTakip
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Signing Config
        run: |
          echo "--- signingConfigs block ---"
          grep -A 10 "signingConfigs {" android/app/build.gradle || true
          echo "--- buildTypes.release block ---"
          grep -A 10 "release {" android/app/build.gradle || true
        working-directory: ./SktTakip

      - name: Configure Gradle Memory
        run: |
          echo -e "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
        working-directory: ./SktTakip

      - name: Build AAB
        run: cd android && ./gradlew bundleRelease -x lintVitalRelease
        working-directory: ./SktTakip

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: SktTakip/android/app/build/outputs/bundle/release/app-release.aab
