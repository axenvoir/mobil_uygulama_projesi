      day: tuesday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
